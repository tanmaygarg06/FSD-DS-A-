<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operators</title>
</head>
<body>
    <script>
      let a=12;
      let b=30;
      let c=a+b;
      alert("Sum Value is  : "+c);
      c=b-a;
      alert("Difference Value is : "+c);
      c=a*b;
      alert("Multiplication Value is : "+c);
      c=b/a;
      alert("Division Value is : "+c);
    </script>
</body>
</html>
